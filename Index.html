<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            background-color: white;
        background-image: url('https://i.pinimg.com/1200x/77/b8/cb/77b8cbb290568a6a4955ee6c65cbda01.jpg');
        background-size: cover;
         background-repeat: no-repeat;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        header{
            text-align: center;
            color: rgb(118, 90, 15);
            text-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        section{
            background-color: white;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
        }
        input[type="text"], select, textarea, input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid white;
            border-radius: 5px;
            text-align: center;
        }
        input[type="placeholder"] {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>FILMONADE</h1>
             <br>
        <p>Leave comments on your favorite movies and give enough lemonds to make lemonade! 🍋🍹</p>
    </header>

    <br>

    <section>
        <form action="">
            <img src="https://cdn.pixabay.com/photo/2016/12/13/21/13/shutter-1905130_640.png" alt="Logo">
            <br>

            <label for="Movie">Movie Title</label>
            <input type="" id="Movxie" name="Movie" placeholder="Enter here">

            <br>
            <label for="genre">Genre/s (select all that apply)</label>
            <br>
            <input type="checkbox" id="genre1" name="Genre" value="Fantasy">
            <label for="genre1">Fantasy</label>

            <input type="checkbox" id="genre2" name="Genre" value="Action">
            <label for="genre1">Action</label>

            <input type="checkbox" id="genre3" name="Genre" value="Horror">
            <label for="genre1">Horror</label>

            <input type="checkbox" id="genre4" name="Genre" value="Sci-Fi">
            <label for="genre1">Sci-Fi</label>

            <input type="checkbox" id="genre5" name="Genre" value="Comedy">
            <label for="genre1">Comedy</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate" value="star1">
            <label for="rate1">🍋</label>

            <input type="radio" id="rate2" name="rate" value="star2">
            <label for="rate2">🍋🍋</label>

            <input type="radio" id="rate3" name="rate" value="star3">
            <label for="rate3">🍋🍋🍋</label>

            <input type="radio" id="rate4" name="rate" value="star4">
            <label for="rate4">🍋🍋🍋🍋</label>

            <input type="radio" id="rate5" name="rate" value="star5">
            <label for="rate5">🍹🍹🍹🍹🍹</label>

            <br>
            <textarea id="review" name="review" placeholder="Write a review.." rows="5" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" name="submit" value="Submit Review">
            <br>

            For movie review tips, click<a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank"> here!</a>

        </form>
    </section>

      <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10     essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
    -->
</body>h
</html>
